version: 1

project_name: ctrlv-cli

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    dir: .
    binary: ctrlv

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - id: ctrlv-cli
    package_name: ctrlv-cli
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    vendor: "Isu-Ismail"
    homepage: "https://github.com/Isu-Ismail/ctrlv"
    maintainer: "Ismail <ismailisims1@gmail.com>"
    description: "ctrlv CLI - Instant Cloud Clipboard & Screenshot Sync"
    license: "MIT"
    bindir: /usr/bin

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
